<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMap - Login</title>
<style>
  :root {
    --bg: #0f0f23;
    --surface: #1a1d2e;
    --card: #222640;
    --border: #2e3350;
    --text: #e4e6f0;
    --text-dim: #7c829a;
    --accent: #e94560;
    --accent-hover: #ff6b81;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* Background decoration */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(ellipse at 30% 20%, rgba(233, 69, 96, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(66, 133, 244, 0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .login-card {
    position: relative;
    z-index: 1;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: var(--shadow-lg);
  }

  .login-logo {
    text-align: center;
    margin-bottom: 32px;
  }

  .login-logo h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .login-logo h1 span {
    color: var(--accent);
  }

  .login-logo p {
    color: var(--text-dim);
    font-size: 14px;
    margin-top: 6px;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .form-group input {
    width: 100%;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .form-group input::placeholder {
    color: var(--text-dim);
    opacity: 0.5;
  }

  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15);
  }

  .login-btn {
    width: 100%;
    padding: 13px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    margin-top: 4px;
  }

  .login-btn:hover {
    background: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(233, 69, 96, 0.3);
  }

  .login-btn:active {
    transform: translateY(0);
  }

  .login-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .error-msg {
    display: none;
    background: rgba(233, 69, 96, 0.12);
    border: 1px solid rgba(233, 69, 96, 0.25);
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 13px;
    color: var(--accent);
    margin-bottom: 16px;
    text-align: center;
  }

  .error-msg.show {
    display: block;
    animation: shakeIn 0.3s ease;
  }

  @keyframes shakeIn {
    0% { transform: translateX(-8px); opacity: 0; }
    25% { transform: translateX(8px); }
    50% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
    100% { transform: translateX(0); opacity: 1; }
  }

  /* Responsive */
  @media (max-width: 480px) {
    .login-card {
      padding: 28px 24px;
    }
    .login-logo h1 {
      font-size: 24px;
    }
  }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <h1><span>TaskMap</span></h1>
    <p>Task Management</p>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm" onsubmit="handleLogin(event)">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="login-btn" id="loginBtn">Login</button>
  </form>
</div>

<script>
function handleLogin(e) {
  e.preventDefault();

  var username = document.getElementById('username').value.trim();
  var password = document.getElementById('password').value;
  var errorMsg = document.getElementById('errorMsg');
  var loginBtn = document.getElementById('loginBtn');

  // Clear previous error
  errorMsg.className = 'error-msg';
  errorMsg.textContent = '';

  if (!username || !password) {
    errorMsg.textContent = 'Please enter username and password';
    errorMsg.className = 'error-msg show';
    return;
  }

  // Disable button
  loginBtn.disabled = true;
  loginBtn.textContent = 'Logging in...';

  fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: username, password: password })
  }).then(function(res) {
    if (res.ok) {
      return res.json();
    }
    return res.json().then(function(data) {
      throw new Error(data.error || 'Login failed');
    });
  }).then(function(data) {
    if (data && data.success) {
      window.location.href = '/';
    } else {
      throw new Error('Login failed');
    }
  }).catch(function(err) {
    errorMsg.textContent = err.message || 'Login failed, please try again';
    errorMsg.className = 'error-msg show';
    loginBtn.disabled = false;
    loginBtn.textContent = 'Login';
  });
}

// Focus username input on load
document.getElementById('username').focus();
</script>

</body>
</html>
