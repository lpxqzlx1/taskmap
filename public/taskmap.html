<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskMap · 任务管理</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --card: #222633;
    --card-hover: #2a2f3e;
    --border: #2e3348;
    --border-light: #3a4060;
    --text: #e4e6f0;
    --text-dim: #7c829a;
    --text-muted: #555b75;
    --accent: #e94560;
    --accent-hover: #ff6b81;
    --accent-bg: rgba(233,69,96,0.12);
    --green: #2ecc71;
    --green-dim: #1a9c54;
    --green-bg: rgba(46,204,113,0.12);
    --blue: #4285f4;
    --blue-bg: rgba(66,133,244,0.12);
    --orange: #f39c12;
    --orange-bg: rgba(243,156,18,0.12);
    --purple: #9b59b6;
    --teal: #1abc9c;
    --radius: 10px;
    --radius-lg: 14px;
    --shadow: 0 4px 24px rgba(0,0,0,0.35);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
  }

  /* ===== TOOLBAR ===== */
  .toolbar {
    position: fixed; top:0; left:0; right:0;
    height: 50px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 14px; gap: 6px;
    z-index: 1000;
  }
  .toolbar-brand {
    font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-right: 14px; letter-spacing: 0.5px; white-space: nowrap;
  }
  .toolbar-sep { width:1px; height:26px; background:var(--border); margin:0 4px; }
  .tb {
    display:flex; align-items:center; gap:5px;
    padding: 5px 10px; background:transparent;
    border: 1px solid transparent; border-radius: 7px;
    color: var(--text-dim); font-size: 12.5px;
    cursor: pointer; transition: all 0.15s; white-space: nowrap;
  }
  .tb:hover { background: var(--card); color: var(--text); border-color: var(--border); }
  .tb.primary { background: var(--accent); color:#fff; border-color: var(--accent); }
  .tb.primary:hover { background: var(--accent-hover); }
  .tb.save { color: var(--green); border-color: transparent; }
  .tb.save:hover { background: rgba(46,204,113,0.12); border-color: rgba(46,204,113,0.25); }
  .tb svg { width:15px; height:15px; flex-shrink:0; }
  .tb .kbd { font-size:10px; opacity:0.5; margin-left:3px; }
  .spacer { flex:1; }

  .toolbar-back {
    display: flex; align-items: center; gap: 4px;
    color: var(--text-dim); font-size: 12px;
    text-decoration: none; margin-right: 8px;
    transition: color 0.15s;
  }
  .toolbar-back:hover { color: var(--text); }
  .toolbar-back svg { width: 14px; height: 14px; }
  .toolbar-project {
    font-size: 12.5px; font-weight: 600;
    color: var(--text);
    margin-right: 6px; white-space: nowrap;
    max-width: 180px; overflow: hidden; text-overflow: ellipsis;
  }

  /* ===== CANVAS ===== */
  .canvas-wrap {
    position: fixed; top:50px; left:0; right:0; bottom:0;
    overflow: hidden; cursor: grab;
  }
  .canvas-wrap.grabbing { cursor: grabbing; }
  .canvas {
    position: absolute; width:1px; height:1px;
    transform-origin: 0 0;
  }

  /* ===== SVG CONNECTIONS ===== */
  .conn-svg {
    position: absolute; top:-5000px; left:-5000px;
    width:10000px; height:10000px;
    pointer-events: none; z-index:1;
  }
  .conn-path {
    fill: none; stroke: var(--border); stroke-width: 2;
    transition: stroke 0.3s;
  }
  .conn-path.active { stroke: var(--accent); stroke-width: 2.5; }
  .conn-path.completed { stroke: var(--green-dim); stroke-dasharray: 6 3; }

  /* ===== TASK NODE ===== */
  .task-node {
    position: absolute;
    width: 260px;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    z-index: 10;
    transition: box-shadow 0.2s, border-color 0.25s, opacity 0.3s;
    overflow: hidden;
  }
  .task-node:hover { box-shadow: var(--shadow-lg); border-color: var(--border-light); }
  .task-node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg), var(--shadow-lg); }
  .task-node.root-node { border-color: var(--accent); }

  .task-node.completed-node { opacity: 0.65; }
  .task-node.completed-node .tn-title { text-decoration: line-through; color: var(--text-dim); }

  /* Header */
  .tn-header {
    padding: 8px 10px;
    display: flex; align-items: center; gap: 7px;
    background: rgba(255,255,255,0.02);
  }
  .tn-checkbox {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border-light);
    background: transparent;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .tn-checkbox:hover { border-color: var(--green); background: var(--green-bg); }
  .tn-checkbox.checked {
    background: var(--green);
    border-color: var(--green);
  }
  .tn-checkbox.checked svg { opacity:1; }
  .tn-checkbox svg { width:12px; height:12px; opacity:0; color:#fff; transition: opacity 0.15s; }

  .tn-color-bar {
    width: 3px; height: 20px;
    border-radius: 2px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .tn-title {
    flex: 1;
    font-size: 13px; font-weight: 600;
    outline: none;
    border: none; background: transparent;
    color: var(--text);
    min-width: 0;
    line-height: 1.3;
  }
  .tn-title[contenteditable="true"] {
    cursor: text;
    background: rgba(255,255,255,0.06);
    border-radius: 4px; padding: 1px 4px; margin: -1px -4px;
  }

  .tn-actions {
    display: flex; gap: 2px;
    opacity: 0; transition: opacity 0.15s;
  }
  .task-node:hover .tn-actions { opacity: 1; }

  .tn-act {
    width: 24px; height: 24px;
    border-radius: 5px; border: none;
    background: transparent; color: var(--text-dim);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .tn-act:hover { background: var(--card-hover); color: var(--text); }
  .tn-act svg { width:13px; height:13px; }

  /* Body */
  .tn-body { padding: 0 10px 8px; }

  .tn-desc {
    font-size: 11.5px; color: var(--text-dim);
    outline: none; min-height: 16px; line-height: 1.4;
    margin-bottom: 6px;
  }
  .tn-desc[contenteditable="true"] {
    cursor: text;
    background: rgba(255,255,255,0.04);
    border-radius: 4px; padding: 2px 4px; margin-bottom: 4px;
  }
  .tn-desc:empty::before { content:'添加备注...'; opacity:0.35; }

  /* Progress bar */
  .tn-progress {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .tn-progress-bar {
    flex:1; height:4px; background: var(--border); border-radius:2px; overflow:hidden;
  }
  .tn-progress-fill {
    height:100%; border-radius:2px;
    background: var(--green);
    transition: width 0.4s ease;
  }
  .tn-progress-text {
    font-size: 10px; color: var(--text-dim);
    min-width: 32px; text-align: right;
  }

  /* ===== COLLAPSE TOGGLE ===== */
  .collapse-toggle {
    position: absolute;
    bottom: -12px; left: 50%; transform: translateX(-50%);
    width: 24px; height: 16px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 0 0 8px 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    z-index: 11;
    transition: all 0.15s;
    color: var(--text-dim);
  }
  .collapse-toggle:hover { background: var(--card-hover); color: var(--text); }
  .collapse-toggle svg { width:12px; height:12px; transition: transform 0.2s; }
  .collapse-toggle.collapsed svg { transform: rotate(180deg); }

  /* ===== CONTEXT MENU ===== */
  .ctx-menu {
    position: fixed;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 5px;
    min-width: 170px;
    box-shadow: var(--shadow-lg);
    z-index: 2000;
    display: none;
  }
  .ctx-menu.show { display: block; }
  .ctx-item {
    padding: 7px 10px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    transition: background 0.12s; color: var(--text);
  }
  .ctx-item:hover { background: var(--card); }
  .ctx-item.danger { color: var(--accent); }
  .ctx-item svg { width:14px; height:14px; opacity:0.7; }
  .ctx-sep { height:1px; background:var(--border); margin:3px 8px; }

  /* ===== ZOOM ===== */
  .zoom-bar {
    position: fixed; bottom:14px; left:14px;
    display:flex; align-items:center; gap:6px;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding:4px 10px;
    z-index: 500; font-size:11px; color:var(--text-dim);
  }
  .z-btn {
    width:22px; height:22px; border-radius:5px; border:none;
    background:transparent; color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; transition: all 0.12s;
  }
  .z-btn:hover { background:var(--card); color:var(--text); }

  /* ===== STATS BAR ===== */
  .stats-bar {
    position: fixed; bottom:14px; right:14px;
    display:flex; gap:12px; align-items:center;
    background: var(--surface); border:1px solid var(--border);
    border-radius: var(--radius); padding:6px 14px;
    z-index: 500; font-size:11.5px; color:var(--text-dim);
  }
  .stat-item { display:flex; align-items:center; gap:4px; }
  .stat-val { font-weight:700; color:var(--text); }
  .stat-val.green { color:var(--green); }
  .stat-val.accent { color:var(--accent); }

  /* ===== MODAL ===== */
  .modal-bg {
    position:fixed; inset:0;
    background:rgba(0,0,0,0.6);
    z-index:3000; display:none;
    align-items:center; justify-content:center;
    backdrop-filter: blur(4px);
  }
  .modal-bg.show { display:flex; }
  .modal {
    background:var(--surface); border:1px solid var(--border);
    border-radius: var(--radius-lg); padding:22px;
    min-width:340px; max-width:480px;
    box-shadow: var(--shadow-lg);
  }
  .modal h3 { font-size:16px; margin-bottom:14px; }
  .modal textarea {
    width:100%; height:180px;
    background:var(--card); border:1px solid var(--border);
    border-radius:8px; color:var(--text);
    font-family:monospace; font-size:11px;
    padding:10px; resize:vertical; outline:none;
  }
  .modal textarea:focus { border-color:var(--accent); }
  .modal-btns { display:flex; gap:7px; margin-top:14px; justify-content:flex-end; }
  .m-btn {
    padding:7px 14px; border-radius:7px;
    border:1px solid var(--border); background:var(--card);
    color:var(--text); cursor:pointer; font-size:12.5px;
    transition: all 0.15s;
  }
  .m-btn:hover { background:var(--border); }
  .m-btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .m-btn.primary:hover { background:var(--accent-hover); }

  /* ===== TOAST ===== */
  .toast-wrap {
    position:fixed; top:60px; right:14px;
    z-index:5000; display:flex; flex-direction:column; gap:6px;
  }
  .toast {
    padding:8px 14px;
    background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); font-size:12.5px;
    box-shadow: var(--shadow);
    animation: toast-in 0.25s ease;
    display:flex; align-items:center; gap:6px;
  }
  .toast.success { border-color:var(--green); }
  .toast.info { border-color:var(--blue); }
  .toast.warning { border-color:var(--orange); }
  @keyframes toast-in {
    from { opacity:0; transform:translateX(16px); }
    to { opacity:1; transform:translateX(0); }
  }

  /* ===== HELP PANEL ===== */
  .help-panel {
    position:fixed; top:50px; right:0;
    width:280px; bottom:0;
    background:var(--surface); border-left:1px solid var(--border);
    z-index:800; padding:18px; overflow-y:auto;
    transform:translateX(100%); transition:transform 0.25s ease;
  }
  .help-panel.show { transform:translateX(0); }
  .help-panel h3 { font-size:14px; margin-bottom:12px; color:var(--accent); }
  .sc-row {
    display:flex; justify-content:space-between;
    padding:5px 0; font-size:12px;
    border-bottom:1px solid var(--border);
  }
  .sc-key {
    background:var(--card); padding:1px 6px;
    border-radius:4px; font-size:11px;
    font-family:monospace; border:1px solid var(--border);
  }

  /* ===== LOADING / ERROR OVERLAY ===== */
  .overlay {
    position: fixed; top: 50px; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 900; background: var(--bg);
  }
  .overlay-content {
    text-align: center; max-width: 420px; padding: 40px;
  }
  .overlay-content h2 {
    font-size: 20px; margin-bottom: 10px;
    color: var(--text);
  }
  .overlay-content p {
    font-size: 14px; color: var(--text-dim);
    line-height: 1.6; margin-bottom: 20px;
  }
  .overlay-content .spinner {
    display: inline-block; width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overlay-content .back-link {
    display: inline-block; padding: 8px 18px;
    background: var(--accent); color: #fff;
    border-radius: 8px; text-decoration: none;
    font-size: 13px; font-weight: 600;
    transition: background 0.15s;
  }
  .overlay-content .back-link:hover { background: var(--accent-hover); }
  .overlay-content .error-icon {
    font-size: 48px; margin-bottom: 14px; opacity: 0.7;
  }

  /* ===== SCROLLBAR ===== */
  ::-webkit-scrollbar { width:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar" id="toolbar">
  <span class="toolbar-brand">TaskMap</span>
  <div class="toolbar-sep" id="toolbarSep1"></div>
  <span class="toolbar-project" id="toolbarProject" style="display:none"></span>
  <a class="toolbar-back" id="toolbarBack" href="index.html" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    返回管理器
  </a>
  <div class="toolbar-sep" id="toolbarSep2" style="display:none"></div>
  <button class="tb primary" onclick="addRootTask()" title="添加任务">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新建任务
  </button>
  <button class="tb" onclick="addChildToSelected()" title="添加子任务" id="btnAddChild">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 15V6a2 2 0 0 0-2-2H6"/><line x1="14" y1="10" x2="20" y2="10"/><line x1="20" y1="10" x2="20" y2="16"/></svg>
    添加子任务
  </button>
  <button class="tb" onclick="deleteSelected()" title="删除">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    删除
  </button>
  <div class="toolbar-sep"></div>
  <button class="tb" onclick="expandAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    展开全部
  </button>
  <button class="tb" onclick="collapseAll()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
    折叠全部
  </button>
  <div class="toolbar-sep"></div>
  <button class="tb save" onclick="saveNow()" title="保存到服务器 (Ctrl+S)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
    保存
  </button>
  <div class="spacer"></div>
  <button class="tb" onclick="logout()" title="Logout">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    Logout
  </button>
  <button class="tb" onclick="toggleHelp()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </button>
</div>

<!-- LOADING OVERLAY -->
<div class="overlay" id="loadingOverlay">
  <div class="overlay-content">
    <div class="spinner"></div>
    <p>Loading...</p>
  </div>
</div>

<!-- CANVAS -->
<div class="canvas-wrap" id="canvasWrap">
  <div class="canvas" id="canvas">
    <svg class="conn-svg" id="connSvg"></svg>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="addChildToSelected()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    添加子任务
  </div>
  <div class="ctx-item" onclick="editSelected()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
    编辑任务
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item" onclick="toggleCollapseSelected()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    <span id="collapseLabel">折叠子任务</span>
  </div>
  <div class="ctx-sep"></div>
  <div class="ctx-item danger" onclick="deleteSelected()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    删除任务
  </div>
</div>

<!-- ZOOM -->
<div class="zoom-bar">
  <button class="z-btn" onclick="zoomOut()">&#8722;</button>
  <span id="zoomLvl">100%</span>
  <button class="z-btn" onclick="zoomIn()">+</button>
  <button class="z-btn" onclick="resetView()" style="margin-left:3px;font-size:11px;">&#10227;</button>
</div>

<!-- STATS -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item">任务 <span class="stat-val" id="statTotal">0</span></div>
  <div class="stat-item">完成 <span class="stat-val green" id="statDone">0</span></div>
</div>

<!-- HELP -->
<div class="help-panel" id="helpPanel">
  <h3>快捷键</h3>
  <div class="sc-row"><span>新建任务</span><span class="sc-key">N</span></div>
  <div class="sc-row"><span>添加子任务</span><span class="sc-key">T</span></div>
  <div class="sc-row"><span>删除</span><span class="sc-key">Delete</span></div>
  <div class="sc-row"><span>编辑</span><span class="sc-key">Enter</span></div>
  <div class="sc-row"><span>折叠/展开</span><span class="sc-key">Space</span></div>
  <div class="sc-row"><span>保存</span><span class="sc-key">Ctrl+S</span></div>
  <div class="sc-row"><span>缩放</span><span class="sc-key">+/ </span></div>
  <div class="sc-row"><span>重置视图</span><span class="sc-key">0</span></div>
  <div class="sc-row"><span>平移画布</span><span class="sc-key">拖拽空白</span></div>
  <h3 style="margin-top:16px;">使用提示</h3>
  <p style="font-size:12px;color:var(--text-dim);line-height:1.6;">
    * 双击标题或备注可编辑<br>
    * 点击圆圈标记任务完成<br>
    * 子任务全部完成时父任务自动完成<br>
    * 点击节点底部箭头折叠/展开子任务<br>
    * 数据自动保存到服务器<br>

  </p>
</div>



<!-- TOAST -->
<div class="toast-wrap" id="toastWrap"></div>

<script>
// ===================== API =====================
const projectId = new URLSearchParams(window.location.search).get('project');
if (projectId) document.title = projectId + ' · TaskMap';

const API = {
  async loadProject() {
    if (!projectId) return null;
    const res = await fetch('/api/projects/' + projectId);
    if (!res.ok) {
      console.error('loadProject failed:', res.status, await res.text().catch(() => ''));
      return null;
    }
    return res.json();
  },
  async saveProject(data) {
    if (!projectId) return;
    const res = await fetch('/api/projects/' + projectId, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data),
    });
    if (!res.ok) {
      console.error('saveProject failed:', res.status, await res.text().catch(() => ''));
    }
    return res;
  },
  async getProjectMeta() {
    const res = await fetch('/api/projects');
    if (!res.ok) return [];
    return res.json();
  },
};

// ===================== STATE =====================
const COLORS = ['#e94560','#4285f4','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#3498db'];
let colorIdx = 0;
function nextColor() { return COLORS[colorIdx++ % COLORS.length]; }

const S = {
  tasks: {},       // id -> task data
  roots: [],       // root task ids
  selected: null,  // selected task id
  nextId: 1,
  pan: { x: 0, y: 0 },
  zoom: 1,
  isPanning: false,
  panStart: { x: 0, y: 0 },
  spaceHeld: false,
};

const wrap = document.getElementById('canvasWrap');
const cvs = document.getElementById('canvas');
const svg = document.getElementById('connSvg');
const ctxMenu = document.getElementById('ctxMenu');

// ===================== TASK DATA =====================
function createTask(title, parentId) {
  const id = 't' + (S.nextId++);
  const task = {
    id,
    title: title || '新任务',
    description: '',
    color: parentId ? ((S.tasks[parentId] && S.tasks[parentId].color) || nextColor()) : nextColor(),
    completed: false,
    collapsed: false,
    children: [],
    parent: parentId || null,
    // layout cache
    _x: 0, _y: 0, _w: 0, _h: 0,
  };
  S.tasks[id] = task;
  if (parentId && S.tasks[parentId]) {
    S.tasks[parentId].children.push(id);
  } else {
    S.roots.push(id);
  }
  return task;
}

function removeTask(id) {
  const task = S.tasks[id];
  if (!task) return;
  // Remove children recursively
  [...task.children].forEach(cid => removeTask(cid));
  // Remove from parent
  if (task.parent && S.tasks[task.parent]) {
    const p = S.tasks[task.parent];
    p.children = p.children.filter(c => c !== id);
  }
  // Remove from roots
  S.roots = S.roots.filter(r => r !== id);
  // Remove DOM
  const el = document.getElementById(id);
  if (el) el.remove();
  delete S.tasks[id];
  if (S.selected === id) S.selected = null;
}

// ===================== COMPLETION LOGIC =====================
function setTaskCompleted(id, completed) {
  const task = S.tasks[id];
  if (!task) return;
  task.completed = completed;

  // If marking incomplete, un-complete all descendants
  if (!completed) {
    task.children.forEach(cid => setTaskCompleted(cid, false));
  }
  // If marking complete, complete all descendants
  if (completed) {
    task.children.forEach(cid => setTaskCompleted(cid, true));
  }

  // Propagate upward: parent auto-complete if all children done
  if (task.parent) {
    const parent = S.tasks[task.parent];
    if (parent) {
      const allDone = parent.children.every(function(cid) { return S.tasks[cid] && S.tasks[cid].completed; });
      if (allDone && !parent.completed) {
        setTaskCompleted(task.parent, true);
      } else if (!allDone && parent.completed) {
        setTaskCompleted(task.parent, false);
      }
    }
  }
}

function getTaskProgress(task) {
  if (!task.children || task.children.length === 0) {
    return task.completed ? 100 : 0;
  }
  let total = 0, done = 0;
  function count(tid) {
    const t = S.tasks[tid];
    if (!t || !t.children) return;
    if (t.children.length === 0) {
      total++;
      if (t.completed) done++;
    } else {
      t.children.forEach(count);
    }
  }
  task.children.forEach(count);
  return total > 0 ? Math.round((done / total) * 100) : 0;
}

function isTaskFullyCompleted(task) {
  if (!task.children || task.children.length === 0) return task.completed;
  return task.children.every(cid => {
    const child = S.tasks[cid];
    return child ? isTaskFullyCompleted(child) : true;
  });
}

// ===================== LAYOUT ENGINE =====================
const NODE_W = 260;
const HEADER_H = 38;
const BODY_H = 60; // approximate
const H_GAP = 50;
const V_GAP = 30;
const SIBLING_GAP = 20;

function measureNode(task) {
  const el = document.getElementById(task.id);
  if (el) {
    task._w = el.offsetWidth;
    task._h = el.offsetHeight;
  } else {
    task._w = NODE_W;
    task._h = HEADER_H + BODY_H;
  }
}

function layoutSubtree(task, depth) {
  measureNode(task);

  if (task.collapsed || task.children.length === 0) {
    task._subtreeH = task._h;
    return;
  }

  let totalH = 0;
  task.children.forEach((cid, i) => {
    const child = S.tasks[cid];
    if (!child) return;
    layoutSubtree(child, depth + 1);
    if (i > 0) totalH += SIBLING_GAP;
    totalH += child._subtreeH;
  });

  task._subtreeH = Math.max(task._h, totalH);
}

function positionSubtree(task, x, y, depth) {
  task._x = x;
  task._y = y;

  if (task.collapsed || task.children.length === 0) return;

  const startX = x + task._w + H_GAP;
  let curY = y + (task._subtreeH - childrenTotalH(task)) / 2;

  task.children.forEach((cid, i) => {
    const child = S.tasks[cid];
    if (!child) return;
    if (i > 0) curY += SIBLING_GAP;
    positionSubtree(child, startX, curY, depth + 1);
    curY += child._subtreeH;
  });
}

function childrenTotalH(task) {
  let h = 0;
  task.children.forEach((cid, i) => {
    const child = S.tasks[cid];
    if (!child) return;
    if (i > 0) h += SIBLING_GAP;
    h += child._subtreeH;
  });
  return h;
}

function layoutAll() {
  // First pass: measure existing DOM elements
  Object.values(S.tasks).forEach(t => measureNode(t));

  // Layout each root tree
  let globalY = 80;
  S.roots.forEach((rid, ri) => {
    const root = S.tasks[rid];
    if (!root) return;
    if (ri > 0) globalY += 60;
    layoutSubtree(root, 0);
    positionSubtree(root, 80, globalY, 0);
    globalY += root._subtreeH;
  });

  // Apply positions
  Object.values(S.tasks).forEach(t => {
    const el = document.getElementById(t.id);
    if (el) {
      el.style.left = t._x + 'px';
      el.style.top = t._y + 'px';
    }
  });

  drawConnections();
  updateStats();
}

// ===================== RENDER NODE =====================
function renderTask(task) {
  const el = document.createElement('div');
  el.className = 'task-node';
  el.id = task.id;
  el.dataset.tid = task.id;

  const hasChildren = task.children.length > 0;
  const progress = getTaskProgress(task);
  const isFullyDone = isTaskFullyCompleted(task);

  el.innerHTML = `
    <div class="tn-header">
      <div class="tn-checkbox${task.completed ? ' checked' : ''}" data-action="toggle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="tn-color-bar" style="background:${task.color}" data-action="color"></div>
      <span class="tn-title">${escHtml(task.title)}</span>
      <div class="tn-actions">
        <button class="tn-act" data-action="add-child" title="添加子任务">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
        <button class="tn-act" data-action="delete" title="删除">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        </button>
      </div>
    </div>
    <div class="tn-body">
      <div class="tn-desc">${escHtml(task.description)}</div>
      ${hasChildren ? `
      <div class="tn-progress">
        <div class="tn-progress-bar"><div class="tn-progress-fill" style="width:${progress}%"></div></div>
        <span class="tn-progress-text">${progress}%</span>
      </div>` : ''}
    </div>
    ${hasChildren ? `
    <div class="collapse-toggle${task.collapsed ? ' collapsed' : ''}" data-action="collapse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    </div>` : ''}
  `;

  cvs.appendChild(el);
  updateNodeVisualState(el, task);
  bindNodeEvents(el, task);
}

function updateNodeDOM(task) {
  const el = document.getElementById(task.id);
  if (!el) return;

  const hasChildren = task.children.length > 0;
  const progress = getTaskProgress(task);

  // Checkbox
  const cb = el.querySelector('.tn-checkbox');
  cb.classList.toggle('checked', task.completed);

  // Title
  const titleEl = el.querySelector('.tn-title');
  if (!titleEl.hasAttribute('contenteditable')) {
    titleEl.textContent = task.title;
  }

  // Desc
  const descEl = el.querySelector('.tn-desc');
  if (!descEl.hasAttribute('contenteditable')) {
    descEl.textContent = task.description;
  }

  // Progress
  if (hasChildren) {
    let pb = el.querySelector('.tn-progress');
    if (!pb) {
      pb = document.createElement('div');
      pb.className = 'tn-progress';
      pb.innerHTML = '<div class="tn-progress-bar"><div class="tn-progress-fill"></div></div><span class="tn-progress-text"></span>';
      el.querySelector('.tn-body').appendChild(pb);
    }
    pb.querySelector('.tn-progress-fill').style.width = progress + '%';
    pb.querySelector('.tn-progress-text').textContent = progress + '%';
  }

  // Collapse toggle
  let ct = el.querySelector('.collapse-toggle');
  if (hasChildren && !ct) {
    ct = document.createElement('div');
    ct.className = 'collapse-toggle' + (task.collapsed ? ' collapsed' : '');
    ct.dataset.action = 'collapse';
    ct.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
    el.appendChild(ct);
    ct.addEventListener('click', (e) => { e.stopPropagation(); toggleCollapse(task.id); });
  }
  if (ct) ct.classList.toggle('collapsed', task.collapsed);

  // Add-child button visibility
  const addBtn = el.querySelector('[data-action="add-child"]');
  if (addBtn) addBtn.style.display = '';

  updateNodeVisualState(el, task);
}

function updateNodeVisualState(el, task) {
  const isFullyDone = isTaskFullyCompleted(task);
  el.classList.toggle('completed-node', isFullyDone);
  el.classList.toggle('selected', S.selected === task.id);
}

// ===================== NODE EVENTS =====================
function bindNodeEvents(el, task) {
  // Click to select
  el.addEventListener('mousedown', (e) => {
    if (e.target.closest('[contenteditable="true"]') || e.target.closest('input')) return;
    if (e.target.closest('.tn-act') || e.target.closest('.collapse-toggle')) return;
    e.stopPropagation();
    selectTask(task.id);
  });

  // Double click to edit
  el.addEventListener('dblclick', (e) => {
    if (e.target.closest('.tn-act') || e.target.closest('.collapse-toggle')) return;
    const t = e.target.closest('.tn-title') || e.target.closest('.tn-desc');
    if (t) {
      t.setAttribute('contenteditable', 'true');
      t.focus();
      const range = document.createRange();
      range.selectNodeContents(t);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  });

  // Blur save
  el.querySelectorAll('.tn-title, .tn-desc').forEach(f => {
    f.addEventListener('blur', () => {
      f.removeAttribute('contenteditable');
      if (f.classList.contains('tn-title')) {
        task.title = f.textContent.trim() || '未命名';
        if (!f.textContent.trim()) f.textContent = task.title;
      } else {
        task.description = f.textContent.trim();
      }
      saveData();
      layoutAll();
    });
    f.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); f.blur(); }
      e.stopPropagation();
    });
  });

  // Action delegation
  el.addEventListener('click', (e) => {
    const actionEl = e.target.closest('[data-action]');
    if (!actionEl) return;
    const action = actionEl.dataset.action;
    e.stopPropagation();
    switch (action) {
      case 'toggle': toggleComplete(task.id); break;
      case 'color': cycleColor(task.id); break;
      case 'add-child': addChildTask(task.id); break;
      case 'delete': removeTask(task.id); layoutAll(); saveData(); showToast('任务已删除', 'warning'); break;
      case 'collapse': toggleCollapse(task.id); break;
    }
  });

  // Context menu
  el.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    e.stopPropagation();
    selectTask(task.id);
    showCtx(e.clientX, e.clientY);
  });
}
// ===================== ACTIONS =====================
function selectTask(id) {
  if (S.selected) {
    const prev = document.getElementById(S.selected);
    if (prev) prev.classList.remove('selected');
  }
  S.selected = id;
  if (id) {
    const el = document.getElementById(id);
    if (el) el.classList.add('selected');
  }
  drawConnections();
  updateCollapseLabel();
}

function toggleComplete(id) {
  const task = S.tasks[id];
  if (!task) return;
  setTaskCompleted(id, !task.completed);
  // Update all affected nodes
  function updateTree(tid) {
    const t = S.tasks[tid];
    if (!t) return;
    updateNodeDOM(t);
    t.children.forEach(updateTree);
  }
  updateTree(id);
  if (task.parent) updateTree(task.parent);
  saveData();
  layoutAll();
}

function cycleColor(id) {
  const task = S.tasks[id];
  if (!task) return;
  const idx = COLORS.indexOf(task.color);
  task.color = COLORS[(idx + 1) % COLORS.length];
  const el = document.getElementById(id);
  const bar = el ? el.querySelector('.tn-color-bar') : null;
  if (bar) bar.style.background = task.color;
  // Propagate color to children
  task.children.forEach(cid => {
    const child = S.tasks[cid];
    if (child) {
        child.color = task.color;
        var cel = document.getElementById(cid);
        if (cel) {
          var cbar = cel.querySelector('.tn-color-bar');
          if (cbar) cbar.style.background = task.color;
        }
    }
  });
  saveData();
}

function addRootTask() {
  const task = createTask('新任务', null);
  renderTask(task);
  selectTask(task.id);
  layoutAll();
  saveData();
  showToast('任务已创建', 'success');
}

function addChildTask(parentId) {
  const parent = S.tasks[parentId];
  if (!parent) return;
  if (parent.collapsed) {
    parent.collapsed = false;
  }
  const task = createTask('新子任务', parentId);
  renderTask(task);
  selectTask(task.id);
  layoutAll();
  saveData();
  showToast('子任务已创建', 'success');
}

function addChildToSelected() {
  hideCtx();
  if (!S.selected) { showToast('请先选中一个任务', 'warning'); return; }
  addChildTask(S.selected);
}

function deleteSelected() {
  hideCtx();
  if (!S.selected) return;
  removeTask(S.selected);
  layoutAll();
  saveData();
  showToast('任务已删除', 'warning');
}

function editSelected() {
  hideCtx();
  if (!S.selected) return;
  const el = document.getElementById(S.selected);
  if (!el) return;
  const titleEl = el.querySelector('.tn-title');
  if (titleEl) {
    titleEl.setAttribute('contenteditable', 'true');
    titleEl.focus();
    const range = document.createRange();
    range.selectNodeContents(titleEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  }
}

function toggleCollapse(id) {
  const task = S.tasks[id];
  if (!task || task.children.length === 0) return;
  task.collapsed = !task.collapsed;

  // Show/hide children
  function setVisibility(tid, visible) {
    const t = S.tasks[tid];
    if (!t) return;
    const el = document.getElementById(tid);
    if (el) el.style.display = visible ? '' : 'none';
    if (!t.collapsed || visible) {
      t.children.forEach(cid => setVisibility(cid, visible && !t.collapsed));
    }
  }
  setVisibility(id, true);
  // Hide all descendants if collapsed
  if (task.collapsed) {
    task.children.forEach(cid => setVisibility(cid, false));
  }

  updateNodeDOM(task);
  layoutAll();
  saveData();
}

function toggleCollapseSelected() {
  hideCtx();
  if (!S.selected) return;
  toggleCollapse(S.selected);
}

function expandAll() {
  Object.values(S.tasks).forEach(t => {
    t.collapsed = false;
    const el = document.getElementById(t.id);
    if (el) el.style.display = '';
  });
  layoutAll();
  saveData();
}

function collapseAll() {
  Object.values(S.tasks).forEach(t => {
    if (t.children.length > 0) t.collapsed = true;
  });
  // Show only roots
  Object.values(S.tasks).forEach(t => {
    const el = document.getElementById(t.id);
    if (el) el.style.display = S.roots.includes(t.id) ? '' : 'none';
  });
  layoutAll();
  saveData();
}

function updateCollapseLabel() {
  const lbl = document.getElementById('collapseLabel');
  if (S.selected && S.tasks[S.selected] && S.tasks[S.selected].children.length > 0) {
    lbl.textContent = S.tasks[S.selected].collapsed ? '展开子任务' : '折叠子任务';
  }
}

// ===================== CONNECTIONS =====================
function drawConnections() {
  svg.querySelectorAll('.conn-path').forEach(p => p.remove());

  function drawTree(task) {
    if (task.collapsed) return;
    task.children.forEach(cid => {
      const child = S.tasks[cid];
      if (!child) return;
      const el = document.getElementById(task.id);
      const cel = document.getElementById(cid);
      if (!el || !cel) return;

      const fx = task._x + el.offsetWidth + 5000;
      const fy = task._y + el.offsetHeight / 2 + 5000;
      const tx = child._x + 5000;
      const ty = child._y + cel.offsetHeight / 2 + 5000;

      const dx = tx - fx;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${fx} ${fy} C ${fx + dx * 0.45} ${fy}, ${tx - dx * 0.45} ${ty}, ${tx} ${ty}`);
      path.setAttribute('class', 'conn-path');

      if (isTaskFullyCompleted(child)) path.classList.add('completed');
      if (S.selected === task.id || S.selected === cid) path.classList.add('active');

      svg.appendChild(path);
      drawTree(child);
    });
  }

  S.roots.forEach(rid => {
    const root = S.tasks[rid];
    if (root) drawTree(root);
  });
}

// ===================== PAN & ZOOM =====================
function applyTransform() {
  cvs.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px) scale(${S.zoom})`;
  document.getElementById('zoomLvl').textContent = Math.round(S.zoom * 100) + '%';
}

function zoomIn() { S.zoom = Math.min(3, S.zoom * 1.15); applyTransform(); }
function zoomOut() { S.zoom = Math.max(0.15, S.zoom / 1.15); applyTransform(); }
function resetView() { S.zoom = 1; S.pan = { x: 0, y: 0 }; applyTransform(); }

// ===================== CONTEXT MENU =====================
function showCtx(x, y) {
  ctxMenu.style.left = x + 'px';
  ctxMenu.style.top = y + 'px';
  ctxMenu.classList.add('show');
  updateCollapseLabel();
}
function hideCtx() { ctxMenu.classList.remove('show'); }

// ===================== STATS =====================
function updateStats() {
  let total = 0, done = 0;
  Object.values(S.tasks).forEach(t => {
    if (t.children.length === 0) { total++; if (t.completed) done++; }
  });
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
}

// ===================== PERSISTENCE (API-based) =====================
let _saveTimer = null;
let _saveVersion = 0;

function saveData() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(async () => {
    _saveTimer = null;
    try {
      const data = serializeTasks();
      data._v = ++_saveVersion;
      await API.saveProject(data);
    } catch(e) {
      console.warn('Save failed:', e);
    }
  }, 300);
}

async function saveNow() {
  const data = serializeTasks();
  try {
    await API.saveProject(data);
    showToast('已保存到服务器', 'success');
  } catch (e) {
    showToast('保存失败', 'error');
  }
}

// On page unload/visibility loss, flush immediately with keepalive
function flushSave() {
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = null;
  const data = serializeTasks();
  data._v = ++_saveVersion;
  const body = JSON.stringify(data);
  fetch('/api/projects/' + projectId, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body,
    keepalive: true,
  }).catch(() => {});
}

window.addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') flushSave();
});

function serializeTasks() {
  const tasks = {};
  Object.values(S.tasks).forEach(t => {
    tasks[t.id] = {
      id: t.id, title: t.title, description: t.description,
      color: t.color, completed: t.completed, collapsed: t.collapsed,
      children: t.children, parent: t.parent,
    };
  });
  return { tasks, roots: S.roots, nextId: S.nextId, colorIdx };
}

async function loadSavedData() {
  if (!projectId) return false;
  try {
    const data = await API.loadProject();
    if (!data || !data.tasks || !data.roots) return false;

    S.roots = data.roots;
    S.nextId = data.nextId || 1;
    colorIdx = data.colorIdx || 0;

    Object.values(data.tasks).forEach(td => {
      if (!td || !td.id) return;
      const task = {
        id: td.id, title: td.title, description: td.description || '',
        color: td.color, completed: td.completed || false,
        collapsed: td.collapsed || false,
        children: td.children || [],
        parent: td.parent || null,
        _x: 0, _y: 0, _w: 0, _h: 0, _subtreeH: 0,
      };
      S.tasks[task.id] = task;
      renderTask(task);
    });

    return true;
  } catch(e) {
    console.warn('Load failed:', e);
    return false;
  }
}



// ===================== HELPERS =====================
function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(msg, type = 'info') {
  const tw = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  t.textContent = msg;
  tw.appendChild(t);
  setTimeout(() => { t.style.opacity = '0'; t.style.transition = 'opacity 0.3s'; setTimeout(() => t.remove(), 300); }, 2500);
}

function toggleHelp() { document.getElementById('helpPanel').classList.toggle('show'); }

function logout() {
  fetch('/api/logout', { method: 'POST' }).then(function() {
    window.location.href = '/login.html';
  });
}

// ===================== SHOW NO-PROJECT STATE =====================
function showNoProject() {
  const ol = document.getElementById('loadingOverlay');
  ol.querySelector('.overlay-content').innerHTML = `
    <div class="error-icon">&#128736;</div>
    <h2>请从任务管理器打开项目</h2>
    <p>此页面需要 <code>?project=项目名</code> 参数才能加载任务数据。请通过任务管理器首页选择或创建项目。</p>
    <a class="back-link" href="index.html">返回管理器</a>
  `;
}

// ===================== SHOW ERROR STATE =====================
function showError(msg) {
  const ol = document.getElementById('loadingOverlay');
  ol.querySelector('.overlay-content').innerHTML = `
    <div class="error-icon">&#9888;</div>
    <h2>加载失败</h2>
    <p>${escHtml(msg || '无法从服务器加载项目数据，请检查网络连接或稍后重试。')}</p>
    <a class="back-link" href="index.html">返回管理器</a>
  `;
}

// ===================== SHOW LOADING STATE =====================
function hideLoading() {
  document.getElementById('loadingOverlay').style.display = 'none';
}

// ===================== PROJECT HEADER =====================
function showProjectHeader() {
  if (projectId) {
    document.getElementById('toolbarProject').textContent = projectId;
    document.getElementById('toolbarProject').style.display = '';
    document.getElementById('toolbarBack').style.display = '';
    document.getElementById('toolbarSep1').style.display = '';
    document.getElementById('toolbarSep2').style.display = '';
  }
}

// ===================== GLOBAL EVENTS =====================
wrap.addEventListener('mousedown', (e) => {
  hideCtx();
  if (!e.target.closest('.task-node')) {
    selectTask(null);
  }
  // Pan
  if (e.button === 0 && (e.target === wrap || e.target === cvs || e.target.tagName === 'svg')) {
    S.isPanning = true;
    S.panStart = { x: e.clientX - S.pan.x, y: e.clientY - S.pan.y };
    wrap.classList.add('grabbing');
    e.preventDefault();
  }
});

wrap.addEventListener('mousemove', (e) => {
  if (S.isPanning) {
    S.pan.x = e.clientX - S.panStart.x;
    S.pan.y = e.clientY - S.panStart.y;
    applyTransform();
  }
});

wrap.addEventListener('mouseup', () => {
  if (S.isPanning) {
    S.isPanning = false;
    wrap.classList.remove('grabbing');
  }
});

wrap.addEventListener('wheel', (e) => {
  e.preventDefault();
  const d = e.deltaY > 0 ? 0.92 : 1.08;
  const nz = Math.max(0.15, Math.min(3, S.zoom * d));
  const mx = e.clientX, my = e.clientY - 50;
  S.pan.x = mx - (mx - S.pan.x) * (nz / S.zoom);
  S.pan.y = my - (my - S.pan.y) * (nz / S.zoom);
  S.zoom = nz;
  applyTransform();
}, { passive: false });

wrap.addEventListener('contextmenu', (e) => {
  if (!e.target.closest('.task-node')) e.preventDefault();
});

document.addEventListener('click', (e) => {
  if (!e.target.closest('.ctx-menu')) hideCtx();
});

document.addEventListener('keydown', (e) => {
  if (e.target.closest('[contenteditable="true"]') || e.target.closest('input') || e.target.closest('textarea')) return;

  if (e.key === 'Escape') {
    selectTask(null);
    document.getElementById('helpPanel').classList.remove('show');
  }
  if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey) addRootTask();
  if ((e.key === 't' || e.key === 'T') && !e.metaKey && !e.ctrlKey) addChildToSelected();
  if (e.key === 'Enter') editSelected();
  if (e.key === ' ' && S.selected) { e.preventDefault(); toggleCollapseSelected(); }
  if ((e.metaKey || e.ctrlKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomIn(); }
  if ((e.metaKey || e.ctrlKey) && e.key === '-') { e.preventDefault(); zoomOut(); }
  if ((e.metaKey || e.ctrlKey) && e.key === '0') { e.preventDefault(); resetView(); }
  if ((e.metaKey || e.ctrlKey) && (e.key === 's' || e.key === 'S')) { e.preventDefault(); saveNow(); }
});

// ===================== INIT =====================
async function init() {
  if (!projectId) {
    showNoProject();
    return;
  }

  showProjectHeader();

  let loaded = false;
  try {
    loaded = await loadSavedData();
  } catch(e) {
    console.warn('Init load error:', e);
  }

  hideLoading();

  if (!loaded) {
    showError('未能加载项目 "' + escHtml(projectId) + '" 的数据，该项目可能不存在或已被删除。');
    return;
  }

  applyTransform();
  // Delay layout to let DOM measure
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      layoutAll();
    });
  });
}

init();
</script>
